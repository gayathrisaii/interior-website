services:
  - type: web
    name: dream2decor
    runtime: node
    plan: free
    region: singapore
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMAIL_USER
        value: umaprasad@dream2decor.in
      - key: EMAIL_PASSWORD
        sync: false
      - key: CONTACT_TO
        value: umaprasad@dream2decor.in
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: umaprasad@dream2decor.in
      - key: BREVO_FROM_NAME
        value: Dream2Decor Website
      - key: SMTP_HOST
        value: smtpout.secureserver.net
      - key: SMTP_PORT
        value: "465"
