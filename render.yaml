services:
  - type: web
    name: dream2decor
    runtime: node
    plan: free
    region: singapore
    rootDir: Frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run serve:ssr:interior-website
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Dream2Decor <umaprasad@dream2decor.in>
      - key: CONTACT_TO
        value: umaprasad@dream2decor.in
